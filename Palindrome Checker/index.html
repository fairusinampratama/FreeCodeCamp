<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <div class="palindrome-checker">
        <div class="user-title">Excel44M @GitHub</div>
        <div class="title">Palindrome Checker</div>
        <div class="text-box">
            <div class="question-box">Enter the text : </div>
            <div class="text-check">
                <input type="text" id="text-input">
                <button id="check-btn">Check</button>
            </div>
            <div class="result" id="result"></div>
        </div>
        <div class="info-box">
            <div class="icon-info"><span class="material-symbols-outlined">
                lightbulb
                </span></div>
            <div class="text-info">A <em>palindrome</em> is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
